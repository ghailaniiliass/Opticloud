{% extends "layouts/module_confirm_delete.html" %}

{% block warning %}Vous êtes sur le point de supprimer cette monture.{% endblock %}

{% block details %}
            <div class="mb-3">
                <label class="form-label fw-bold">ID Monture</label>
                <input type="text"
                       class="form-control"
                       value="{{ object.idmonture }}"
                       disabled>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Modèle</label>
                <input type="text"
                       class="form-control"
                       value="{{ object.modele|default_if_none:'' }}"
                       disabled>
            </div>
{% endblock %}
