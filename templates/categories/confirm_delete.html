{% extends "layouts/module_confirm_delete.html" %}

{% block warning %}Vous êtes sur le point de supprimer cette catégorie.{% endblock %}

{% block details %}
            <div class="mb-3">
                <label class="form-label fw-bold">ID CATÉGORIE</label>
                <input type="text"
                       class="form-control"
                       value="{{ object.id_categorie }}"
                       disabled>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Nom catégorie</label>
                <input type="text"
                       class="form-control"
                       value="{{ object.nom_categorie }}"
                       disabled>
            </div>
{% endblock %}
