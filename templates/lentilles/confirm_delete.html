{% extends "layouts/module_confirm_delete.html" %}

{% block warning %}Vous êtes sur le point de supprimer cette lentille.{% endblock %}

{% block details %}
            <div class="mb-3">
                <label class="form-label fw-bold">ID Lentille</label>
                <input type="text"
                       class="form-control"
                       value="{{ object.idlentille }}"
                       disabled>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Nom</label>
                <input type="text"
                       class="form-control"
                       value="{{ object.nom|default_if_none:'' }}"
                       disabled>
            </div>
{% endblock %}
