{% extends "layouts/module_confirm_delete.html" %}

{% block warning %}Vous êtes sur le point de supprimer ce fournisseur.{% endblock %}

{% block details %}
            <div class="mb-3">
                <label class="form-label fw-bold">ID Fournisseur</label>
                <input type="text"
                       class="form-control"
                       value="{{ object.idfournisseur }}"
                       disabled>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Nom Fournisseur</label>
                <input type="text"
                       class="form-control"
                       value="{{ object.nom|default_if_none:'' }}"
                       disabled>
            </div>
{% endblock %}
